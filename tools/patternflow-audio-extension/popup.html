<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patternflow Audio</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="icons/icon-32.png" alt="">
    <h1>Patternflow Audio</h1>
  </div>
  <div id="status" class="status bad">Idle</div>
</header>

<section class="device-section">
  <label class="label" for="host">Device</label>
  <div class="device">
    <input id="host" type="text" spellcheck="false" value="patternflow.local">
    <button id="connect">Start</button>
  </div>
  <div id="detail" class="detail">Open the tab you want to hear, then press Start.</div>
  <div class="actions">
    <button id="stop">Stop</button>
    <button id="release" title="Hand the knobs back to the encoders">Release knobs</button>
    <button id="openEditor" title="The full mapping editor - band boxes on the spectrum, response curves">Editor &#8599;</button>
  </div>
</section>

<section class="spectrum-section">
  <div class="section-head">
    <span class="label">Spectrum</span>
    <span class="hint">click a band to edit it</span>
  </div>
  <div class="spectrum-wrap">
    <canvas id="spectrum" width="760" height="220"></canvas>
    <div id="spectrumBands" class="spectrum-bands"></div>
  </div>
  <div class="spectrum-scale">
    <span>20</span>
    <span>100</span>
    <span>1k</span>
    <span>10k</span>
    <span>20k</span>
  </div>
  <!-- Four, one per knob. The spectrum above selects too; this row is here so
       switching does not depend on hitting a narrow band with the pointer. -->
  <div id="bandTabs" class="band-tabs"></div>
</section>

<section>
  <div class="global">
    <label>
      <span>Smoothing</span>
      <input id="smoothing" type="range" min="0.05" max="0.9" step="0.01">
    </label>
    <span id="smoothingValue" class="value"></span>
  </div>
</section>

<main id="bands"></main>

<section>
  <!-- Connecting without audio and driving the knobs by hand is how you tell a
       dead panel from a dead capture. Useful, and not what anyone opens this
       for — so it is one click away rather than always on screen. -->
  <details class="diagnostics">
    <summary>Test without audio</summary>
    <button id="manualConnect">Connect only</button>
  <div class="manual-grid">
    <label>K1 <input class="manual" data-knob="0" type="range" min="0" max="1" step="0.01" value="0.50"><output>0.50</output></label>
    <label>K2 <input class="manual" data-knob="1" type="range" min="0" max="1" step="0.01" value="0.50"><output>0.50</output></label>
    <label>K3 <input class="manual" data-knob="2" type="range" min="0" max="1" step="0.01" value="0.50"><output>0.50</output></label>
    <label>K4 <input class="manual" data-knob="3" type="range" min="0" max="1" step="0.01" value="0.50"><output>0.50</output></label>
  </div>
  </details>
</section>

<template id="band-template">
  <section class="band">
    <div class="band-head">
      <strong class="band-title"></strong>
      <div class="band-actions">
        <label class="target">K
          <select class="knob">
            <option value="0">1</option>
            <option value="1">2</option>
            <option value="2">3</option>
            <option value="3">4</option>
          </select>
        </label>
        <button type="button" class="mute-band">Mute</button>
      </div>
    </div>

    <div class="band-row">
      <span class="band-key">Listens to</span>
      <output class="hzOut mono"></output>
    </div>
    <div class="hz-presets"></div>

    <div class="band-row" style="margin-top:14px">
      <span class="band-key">Response</span>
      <span class="band-note">drag the handles</span>
    </div>

    <div class="plot-wrap">
      <div class="plot-axis">
        <span>1.0</span><span>0.5</span><span>0.0</span>
      </div>
      <div class="plot-col">
        <div class="plot">
          <div class="plot-out"></div>
          <div class="plot-in"></div>
          <svg class="plot-curve" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polyline points="" fill="none" stroke="currentColor" stroke-width="1"
                      vector-effect="non-scaling-stroke"></polyline>
          </svg>
          <div class="plot-vline"></div>
          <div class="plot-hline"></div>
          <div class="plot-dot"></div>
          <div class="h h-in-min" data-h="inMin"></div>
          <div class="h h-in-max" data-h="inMax"></div>
          <div class="h h-out-max" data-h="outMax"></div>
          <div class="h h-out-min" data-h="outMin"></div>
        </div>
        <div class="plot-scale">
          <span>quiet</span><span>how loud this band is</span><span>loud</span>
        </div>
      </div>
    </div>

    <div class="readout">
      <div><span>Ignores below</span><output class="r-in-min mono"></output></div>
      <div><span>Full at</span><output class="r-in-max mono"></output></div>
      <div><span>Knob rests at</span><output class="r-out-min mono"></output></div>
      <div><span>Knob peaks at</span><output class="r-out-max mono"></output></div>
    </div>

    <div class="boost-row">
      <span class="band-key">Boost</span>
      <div class="boost-steps"></div>
      <output class="gainOut mono"></output>
    </div>
    <div class="boost-hint"></div>

    <div class="meter-row">
      <span class="meter-key">in</span>
      <div class="meter"><div class="level"></div></div>
    </div>
    <div class="meter-row">
      <span class="meter-key">knob</span>
      <div class="meter out"><div class="output"></div></div>
      <output class="travelOut mono"></output>
    </div>
  </section>
</template>

<script src="popup.js"></script>
</body>
</html>
