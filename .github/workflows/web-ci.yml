name: Web CI

# Lint + build the Next.js site so broken code can't reach main.
# Only runs when something under web/ (or this workflow) changes.
on:
  pull_request:
    paths:
      - "web/**"
      # The Home Assistant card is built from web/src but committed into the
      # integration, so a change to the built artifact has to be checked too.
      - "custom_components/patternflow/www/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "custom_components/patternflow/www/**"
      - ".github/workflows/web-ci.yml"

# Cancel an in-progress run if newer commits are pushed to the same ref.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint is a hard gate: lint errors can't reach main (warnings still pass).
      - name: Lint
        run: npm run lint

      # Build is the hard gate: broken code can't reach main.
      - name: Build
        run: npm run build

      # The Home Assistant card ships as a committed bundle, because HACS and a
      # manual copy both hand Home Assistant a directory rather than a build.
      # That makes the artifact rotting the real risk: this rebuilds it and
      # fails if what is committed no longer matches web/src.
      - name: Check the Home Assistant card is up to date
        run: npm run check:ha-card

      # And that the bundle loads, and still speaks the same protocol as the
      # sandbox document shipped beside it.
      - name: Smoke-test the Home Assistant card
        run: npm run check:ha-card-smoke
