name: HACS Validation

# What HACS and Home Assistant check before a user ever sees the integration.
# Both of these fail on things that are invisible in this repository: a manifest
# key Home Assistant needs, a brand image in the wrong place, a hacs.json that
# does not describe the release layout.
on:
  pull_request:
    paths:
      - "custom_components/patternflow/**"
      - "hacs.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "custom_components/patternflow/**"
      - "hacs.json"
      - ".github/workflows/validate.yml"
  # HACS's own rules move without this repository changing, so check anyway.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Reads the checkout, so this one does validate the branch it runs on. It
  # globs custom_components/*/manifest.json, which is exactly why the component
  # had to move to the repository root.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # NOTE: this one validates the PUBLISHED repository over the GitHub API, not
  # the checkout. On the pull request that first moves the component it will
  # fail, because main does not have custom_components/ yet, and go green once
  # that has merged. Expected, and not a sign the workflow is wrong.
  #
  # brands is ignored because home-assistant/brands has no
  # custom_integrations/patternflow entry. Adding one is a pull request to that
  # repository, and a follow-up if the HACS default store is ever the goal.
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
