name: Core knows no features

# Source contracts and native regressions on every firmware change:
#
#   check_boundaries.py — the core/feature boundary, mechanically. The rule
#   ("the core names no feature") lived in comments and was violated three
#   times before it grew teeth; on its first run the checker also found a
#   fourth (the sketch comparing a pattern name against the show scheduler's
#   "Black"). Prose does not hold; a failing build does.
#
#   check_sources.py — mangled string literals and raw control bytes, the
#   patch-script damage that compiles into garbage or reports its error
#   thirty lines from the cause.
#
#   check_math.py — the accuracy of core_math.h, core_color.h and core_noise.h,
#   pinned as bands. abi/pf_module.h includes those three files into every .pfm,
#   so they are the published pattern SDK, and until this check nothing here ran
#   a number through any of them: their behaviour was asserted only in
#   doc-comments, two of which were wrong about their own function. A row that
#   moves in EITHER direction fails, because a change to these headers changes
#   what every pattern built afterwards renders — and reaches only newly built
#   modules, since an installed .pfm carries its own compiled copy.
#
#   check_parser.py — the vendored HTTP request parser, the real Parsing.cpp
#   against a scripted socket and a fake clock. It runs on pf-net, where a loop
#   that waits for the peer without sleeping starves IDLE0 and the Core-0
#   watchdog reboots the board 5 s later. That has happened three times
#   (src/webserver/VENDORED.md) and nothing on a PC stood in the way of any of
#   them. Truncated, stalled and trickled requests are replayed here, every
#   cut point of each, and a wait that neither reads a byte nor sleeps fails -
#   as does a request still being parsed after its timeouts have run out.
#
#   check_crash.py — what a boot makes of the reset before it (src/core_crash.h):
#   a breadcrumb in RAM that only some resets keep, a core dump in flash that
#   only some resets write. A mistake there crashes nothing - it reports last
#   week's backtrace as today's - and a panel cannot be made to take every
#   reset on demand, so the header is booted here through reset reason x
#   breadcrumb x dump, with a module's code at an internal-RAM address and at
#   the 0x43xxxxxx a PC carries for code in PSRAM.
#
# The blit, thumbnail mailbox, network recovery and ELF bounds also run on a
# host C++ compiler with ASan/UBSan. The four-composition Xtensa compile stays
# local (`firmware/bundles/build.sh all`) and remains required for core edits.
on:
  pull_request:
    paths:
      - "firmware/patternflow/**"
      - "firmware/bundles/**"
      - "firmware/modules/**"
      - "firmware/toolchain/**"
      - "web/src/lib/presets/**"
      - "web/public/packs/basics.zip"
      # The version lives in six files; check_versions.py reads these three too.
      - "web/public/flash/**"
      - "web/src/app/editions/editions-data.ts"
      - "AGENTS.md"
      - ".github/workflows/firmware-checks.yml"
  push:
    branches: [main]
    paths:
      - "firmware/patternflow/**"
      - "firmware/bundles/**"
      - "firmware/modules/**"
      - "firmware/toolchain/**"
      - "web/public/packs/basics.zip"
      - "web/public/flash/**"
      - "web/src/app/editions/editions-data.ts"
      - "AGENTS.md"

concurrency:
  group: firmware-checks-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: The core names no feature
        run: python firmware/toolchain/check_boundaries.py
      - name: The module ABI does not move silently
        run: python firmware/toolchain/check_abi_freeze.py
      - name: Module ELF bounds and shipped patterns
        run: python firmware/toolchain/check_module_elf.py --sanitize
      - name: HUB75 colour planes and control bits
        run: python firmware/toolchain/check_blit.py --sanitize
      - name: Panel plane weights and monotone response
        run: python firmware/toolchain/check_oe.py --sanitize
      - name: Pattern SDK maths, colour and noise still measure the same
        run: python firmware/toolchain/check_math.py --sanitize
      - name: Thumbnail mailbox ownership and invalidation
        run: python firmware/toolchain/check_thumbs.py --sanitize
      - name: Wi-Fi and name-service recovery
        run: python firmware/toolchain/check_network.py --sanitize
      - name: Runtime admission, resident modules and frame-boundary lifecycle
        run: python firmware/toolchain/check_runtime.py --sanitize
      - name: Crash record tells this reset's dump from an older one
        run: python firmware/toolchain/check_crash.py --sanitize
      - name: HTTP backpressure and bounded send attempts
        run: python firmware/toolchain/check_send.py --sanitize
      - name: HTTP request parser sleeps in every wait and gives up on a request that stopped
        run: python firmware/toolchain/check_parser.py --sanitize
      - name: MIDI event ownership and remote-input echo suppression
        run: python firmware/toolchain/check_midi.py --sanitize
      - name: No mangled literals or raw control bytes
        run: python firmware/toolchain/check_sources.py
      - name: Web and firmware presets are still twins
        run: python firmware/toolchain/check_presets.py
      - name: The six places a version lives agree
        run: python firmware/toolchain/check_versions.py
