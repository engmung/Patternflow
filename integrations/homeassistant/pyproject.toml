# Nothing here is ever published to PyPI or imported as a package — the
# integration is copied into a Home Assistant config directory. This stanza
# exists so `pip install ".[dev]"` resolves the test dependencies from one
# place, which is also what CI runs.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "patternflow-homeassistant"
version = "0.1.0"
description = "Home Assistant integration for the Patternflow LED instrument"
requires-python = ">=3.13"
license = { text = "MIT" }

# Nothing at runtime: everything this integration needs (aiohttp, voluptuous)
# ships with Home Assistant, and `requirements` in manifest.json is empty on
# purpose — a custom integration that pulls in packages is a custom integration
# that breaks on somebody's upgrade.
dependencies = []

[project.optional-dependencies]
dev = ["aiohttp", "pytest>=7", "pytest-asyncio>=0.23", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Home Assistant's own floor. The integration runs inside HA, so there is no
# older interpreter to stay compatible with.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff
    "D",    # docstrings — HA requires them on every module and public symbol
    "ASYNC",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test classes and fakes group cases; docstrings on every assertion helper and
# every dunder of a stub are noise rather than documentation. D401 goes too:
# a fixture named for what it returns reads better as a noun than as a command.
"tests/*" = ["D101", "D102", "D103", "D105", "D107", "D401"]
